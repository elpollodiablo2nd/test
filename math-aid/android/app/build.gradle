plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.mistral.mathaid'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.mistral.mathaid'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Kun framework-klasser (android.app.Activity + android.webkit.WebView) — ingen eksterne afhængigheder.
}
