plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.mistral.mathaid'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.mistral.mathaid'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // Kommer fra miljøvariabler sat af CI (secrets) eller lokal keystore.
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: ''
            keyPassword System.getenv('KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // Kun framework-klasser (android.app.Activity + android.webkit.WebView) — ingen eksterne afhængigheder.
}
