<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Aid — Pixel Edition</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M0 0h24v3.428H0z' fill='%23FFD800'/%3E%3Cpath d='M0 3.428h3.428v3.428H0zM10.286 3.428h3.428v3.428h-3.428zM20.572 3.428H24v3.428h-3.428z' fill='%23FFD800'/%3E%3Cpath d='M0 6.856h3.428v3.428H0zM10.286 6.856h3.428v3.428h-3.428zM20.572 6.856H24v3.428h-3.428z' fill='%23FFAF00'/%3E%3Cpath d='M3.428 10.258h17.144v3.428H3.428z' fill='%23FF8205'/%3E%3Cpath d='M3.428 13.686h3.429v3.428H3.428zM10.286 13.686h3.429v3.428h-3.429zM17.142 13.686h3.43v3.428h-3.43z' fill='%23FA500F'/%3E%3Cpath d='M0 17.114h10.286v3.428H0zM13.714 17.114H24v3.428h-10.286z' fill='%23E10500'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --m-yellow: #FFD800;
            --m-amber: #FFAF00;
            --m-orange: #FF8205;
            --m-orange-dark: #FA500F;
            --m-red: #E10500;
            --ink: #000000;
            --cream: #FFFAEB;
            --night: #0B0714;
            --screen: #150C24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'VT323', 'Courier New', monospace;
            background-color: var(--night);
            background-image:
                radial-gradient(ellipse at 50% -10%, rgba(255, 130, 5, 0.20), transparent 60%),
                linear-gradient(rgba(255, 216, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 216, 0, 0.05) 2px, transparent 2px);
            background-size: auto, 32px 32px, 32px 32px;
            color: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 3rem;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 2px, transparent 2px 4px);
            z-index: 50;
        }

        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-m {
            width: 96px;
            height: 96px;
            shape-rendering: crispEdges;
            filter: drop-shadow(5px 5px 0 rgba(0, 0, 0, 0.8));
            animation: bob 1.6s steps(2, jump-none) infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 2rem;
            margin-top: 1.25rem;
            letter-spacing: 2px;
            background: linear-gradient(180deg, var(--m-yellow) 0%, var(--m-amber) 30%, var(--m-orange) 55%, var(--m-orange-dark) 78%, var(--m-red) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(4px 4px 0 #000);
        }

        @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
            h1 { color: var(--m-orange); background: none; }
        }

        .subtitle {
            font-size: 1.4rem;
            color: var(--m-amber);
            margin-top: 0.75rem;
            text-shadow: 2px 2px 0 #000;
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: currentColor;
            box-shadow: 0 -8px 0 currentColor, 0 8px 0 currentColor, -8px 0 0 currentColor, 8px 0 0 currentColor;
            animation: twinkle 1.2s steps(2, jump-none) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.15; transform: translateY(-6px); }
        }

        .math-card {
            background: var(--cream);
            color: var(--ink);
            border: 4px solid var(--ink);
            box-shadow: 8px 8px 0 var(--m-red), 8px 8px 0 4px var(--ink);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .type-badge {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            padding: 0.55rem 0.8rem;
            margin-bottom: 1.25rem;
            background: var(--m-yellow);
            color: var(--ink);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
        }

        #type-badge[data-type="subtraction"] { background: var(--m-amber); }
        #type-badge[data-type="multiplication"] { background: var(--m-orange); }
        #type-badge[data-type="division"] { background: var(--m-orange-dark); color: var(--cream); }
        #type-badge[data-type="equation"] { background: var(--m-red); color: var(--cream); }
        #type-badge[data-type="cirkel"] { background: var(--m-yellow); }
        #type-badge[data-type="trekant"] { background: var(--m-amber); }
        #type-badge[data-type="firkant"] { background: var(--m-orange); }
        #type-badge[data-type="rumfang"] { background: var(--m-red); color: var(--cream); }

        .problem-display {
            padding: 1.5rem;
            min-height: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background:
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 2px, transparent 2px 5px),
                radial-gradient(ellipse at center, #1E1133 0%, var(--screen) 70%);
            border: 4px solid var(--ink);
            box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.7), inset -4px -4px 0 rgba(255, 255, 255, 0.07);
            margin-bottom: 1.5rem;
        }

        .figure {
            display: none;
        }

        .figure.visible {
            display: block;
        }

        .figure svg {
            width: 180px;
            height: auto;
        }

        .fig-label {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 17px;
            fill: var(--cream);
        }

        .module-switch {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .module-btn {
            background: var(--screen);
            color: var(--cream);
        }

        .module-btn.active {
            background: var(--m-yellow);
            color: var(--ink);
        }

        .math-expression {
            font-family: 'VT323', 'Courier New', monospace;
            font-weight: bold;
            font-size: 2.8rem;
            color: var(--m-yellow);
            text-shadow: 0 0 14px rgba(255, 216, 0, 0.55), 4px 4px 0 var(--m-red);
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 0.9em;
            margin-left: 10px;
            background: var(--m-yellow);
            box-shadow: 0 0 10px rgba(255, 216, 0, 0.8);
            animation: blink 0.9s steps(1) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 4px solid var(--ink);
            box-shadow: 0 6px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.05s steps(1), box-shadow 0.05s steps(1), filter 0.1s;
        }

        button:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--ink);
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--ink);
        }

        .btn-primary {
            background: var(--m-orange);
            color: var(--ink);
        }

        .btn-refresh {
            background: var(--cream);
            color: var(--ink);
        }

        .answer-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        #answer-input {
            flex: 1;
            min-width: 0;
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 1.8rem;
            padding: 0.5rem 1rem;
            background: #ffffff;
            color: var(--ink);
            border: 4px solid var(--ink);
            box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.12);
            outline: none;
        }

        #answer-input:focus {
            box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.12), 4px 4px 0 var(--m-orange);
        }

        #answer-input:disabled {
            background: #EAE2D0;
        }

        .btn-check {
            background: var(--m-amber);
            color: var(--ink);
            white-space: nowrap;
        }

        .feedback {
            display: none;
            margin-bottom: 1.25rem;
            padding: 0.9rem 1.25rem;
            border: 4px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            line-height: 1.7;
        }

        .feedback.visible {
            display: block;
        }

        .feedback.correct {
            background: var(--m-yellow);
            color: var(--ink);
        }

        .feedback.wrong {
            background: var(--m-red);
            color: var(--cream);
            animation: shake 0.25s steps(2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-6px); }
        }

        .solution {
            display: none;
            margin-top: 1.25rem;
            padding: 1.25rem 1.5rem;
            background: #FFF3D0;
            border: 4px solid var(--ink);
            border-left: 12px solid var(--m-orange-dark);
            box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.08);
        }

        .solution.visible {
            display: block;
            animation: pop 0.15s steps(2);
        }

        @keyframes pop {
            from { transform: scale(0.96); }
            to { transform: scale(1); }
        }

        .solution-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            color: var(--m-orange-dark);
            margin-bottom: 1rem;
        }

        .solution-steps {
            font-size: 1.45rem;
            line-height: 1.6;
        }

        .solution-steps kbd {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 1.3rem;
            background: var(--ink);
            color: var(--m-yellow);
            padding: 0.1rem 0.45rem;
            border: 3px solid var(--ink);
            box-shadow: inset -3px -3px 0 rgba(255, 255, 255, 0.18), inset 3px 3px 0 rgba(0, 0, 0, 0.6);
        }

        .step {
            position: relative;
            margin-bottom: 0.6rem;
            padding-left: 1.25rem;
        }

        .step::before {
            content: "►";
            position: absolute;
            left: 0;
            color: var(--m-orange-dark);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.75rem;
            padding: 1rem;
            background: var(--screen);
            border: 4px solid var(--ink);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.8);
        }

        .stat-item {
            text-align: center;
            padding: 0.6rem 0.25rem;
            background: rgba(0, 0, 0, 0.35);
            border: 3px solid rgba(255, 250, 235, 0.25);
        }

        .stat-value {
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            color: var(--m-yellow);
            text-shadow: 3px 3px 0 #000;
        }

        .stat-label {
            font-size: 1.05rem;
            margin-top: 0.35rem;
            color: var(--cream);
            opacity: 0.85;
        }

        .hint {
            margin-top: 1.25rem;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            color: rgba(255, 250, 235, 0.6);
            text-shadow: 2px 2px 0 #000;
        }

        .hint kbd {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            background: var(--ink);
            color: var(--m-yellow);
            border: 3px solid rgba(255, 250, 235, 0.4);
            padding: 0.3rem 0.45rem;
        }

        @media (max-width: 640px) {
            h1 { font-size: 1.25rem; }
            .logo-m { width: 72px; height: 72px; }
            .math-expression { font-size: 2rem; }
            .buttons { flex-direction: column; }
            .answer-row { flex-direction: column; }
            button { width: 100%; justify-content: center; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .math-card { padding: 1.25rem; }
            .figure svg { width: 140px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="sparkle" style="top: 6px; left: 14%; color: var(--m-yellow);"></span>
            <span class="sparkle" style="top: 40px; right: 16%; color: var(--m-orange); animation-delay: 0.3s;"></span>
            <span class="sparkle" style="top: 90px; left: 8%; color: var(--m-red); animation-delay: 0.6s;"></span>
            <span class="sparkle" style="top: 110px; right: 9%; color: var(--m-amber); animation-delay: 0.9s;"></span>
            <svg class="logo-m" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-label="Mistral M logo">
                <path d="M0 0h24v3.428H0z" fill="#FFD800"/>
                <path d="M0 3.428h3.428v3.428H0zM10.286 3.428h3.428v3.428h-3.428zM20.572 3.428H24v3.428h-3.428z" fill="#FFD800"/>
                <path d="M0 6.856h3.428v3.428H0zM10.286 6.856h3.428v3.428h-3.428zM20.572 6.856H24v3.428h-3.428z" fill="#FFAF00"/>
                <path d="M3.428 10.258h17.144v3.428H3.428z" fill="#FF8205"/>
                <path d="M3.428 13.686h3.429v3.428H3.428zM10.286 13.686h3.429v3.428h-3.429zM17.142 13.686h3.43v3.428h-3.43z" fill="#FA500F"/>
                <path d="M0 17.114h10.286v3.428H0zM13.714 17.114H24v3.428h-10.286z" fill="#E10500"/>
            </svg>
            <h1>MATH AID</h1>
            <p class="subtitle">Øvelse på 8. klasse-niveau · Pixel-udgave</p>
        </header>

        <div class="module-switch">
            <button id="mod-tal" class="module-btn active" onclick="setModule('tal')">🔢 TAL &amp; LIGNINGER</button>
            <button id="mod-geometri" class="module-btn" onclick="setModule('geometri')">📐 GEOMETRI</button>
        </div>

        <div class="math-card">
            <div id="type-badge" class="type-badge" data-type="addition"></div>
            <div class="problem-display">
                <div id="figure" class="figure"></div>
                <div class="expr-line"><span id="problem" class="math-expression"></span><span class="cursor"></span></div>
            </div>

            <div class="answer-row">
                <input id="answer-input" type="text" inputmode="decimal" placeholder="Dit svar..." autocomplete="off">
                <button id="check-answer" class="btn-check" onclick="checkAnswer()">✅ Tjek svar</button>
            </div>

            <div id="answer-feedback" class="feedback"></div>

            <div class="buttons">
                <button id="show-solution" class="btn-primary" onclick="showSolution()">💡 Vis løsning</button>
                <button class="btn-refresh" onclick="generateProblem()">🔄 Ny opgave</button>
            </div>

            <div id="solution" class="solution">
                <div class="solution-title">TRIN-FOR-TRIN-LØSNING</div>
                <div id="solution-steps" class="solution-steps"></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item" id="stat-0"><div class="stat-value" id="stat-v0">0</div><div class="stat-label" id="stat-l0"></div></div>
            <div class="stat-item" id="stat-1"><div class="stat-value" id="stat-v1">0</div><div class="stat-label" id="stat-l1"></div></div>
            <div class="stat-item" id="stat-2"><div class="stat-value" id="stat-v2">0</div><div class="stat-label" id="stat-l2"></div></div>
            <div class="stat-item" id="stat-3"><div class="stat-value" id="stat-v3">0</div><div class="stat-label" id="stat-l3"></div></div>
            <div class="stat-item" id="stat-4"><div class="stat-value" id="stat-v4">0</div><div class="stat-label" id="stat-l4"></div></div>
            <div class="stat-item" id="stat-5"><div class="stat-value" id="stat-v5">0</div><div class="stat-label" id="stat-l5"></div></div>
        </div>

        <p class="hint"><kbd>ENTER</kbd> TJEK SVAR &nbsp;&nbsp; <kbd>R</kbd> NY OPGAVE</p>
    </div>

    <script>
        const PI = 3.14;

        let activeModule = 'tal';

        let stats = {
            tal: { total: 0, addition: 0, subtraction: 0, multiplication: 0, division: 0, equation: 0 },
            geometri: { total: 0, cirkel: 0, trekant: 0, firkant: 0, rumfang: 0 }
        };

        let currentProblem = {
            type: '',
            problem: '',
            answer: 0,
            figure: '',
            steps: []
        };

        const problemTypes = [
            { type: 'addition', weight: 25 },
            { type: 'subtraction', weight: 25 },
            { type: 'multiplication', weight: 20 },
            { type: 'division', weight: 15 },
            { type: 'equation', weight: 15 }
        ];

        const typeNames = {
            addition: 'Addition',
            subtraction: 'Subtraktion',
            multiplication: 'Multiplikation',
            division: 'Division',
            equation: 'Ligninger',
            cirkel: 'Cirkel',
            trekant: 'Trekant',
            firkant: 'Firkant',
            rumfang: 'Rumfang'
        };

        const geometryTypes = [
            { type: 'cirkel', weight: 30 },
            { type: 'trekant', weight: 25 },
            { type: 'firkant', weight: 25 },
            { type: 'rumfang', weight: 20 }
        ];

        const statConfig = {
            tal: {
                keys: ['total', 'addition', 'subtraction', 'multiplication', 'division', 'equation'],
                labels: ['Opgaver løst', 'Addition', 'Subtraktion', 'Multiplikation', 'Division', 'Ligninger'],
                colors: ['#FFD800', '#FFD800', '#FFAF00', '#FF8205', '#FA500F', '#FF6A5E']
            },
            geometri: {
                keys: ['total', 'cirkel', 'trekant', 'firkant', 'rumfang', null],
                labels: ['Opgaver løst', 'Cirkler', 'Trekanter', 'Firkanter', 'Rumfang', ''],
                colors: ['#FFD800', '#FFD800', '#FFAF00', '#FF8205', '#FF6A5E', '#FFD800']
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderStats();
            generateProblem();
        });

        function setModule(m) {
            activeModule = m;
            document.getElementById('mod-tal').classList.toggle('active', m === 'tal');
            document.getElementById('mod-geometri').classList.toggle('active', m === 'geometri');
            renderStats();
            generateProblem();
        }

        function generateProblem() {
            document.getElementById('solution').classList.remove('visible');
            document.getElementById('show-solution').textContent = '💡 Vis løsning';
            currentProblem.figure = '';

            const types = activeModule === 'tal' ? problemTypes : geometryTypes;
            const totalWeight = types.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.random() * totalWeight;
            let selectedType = types[0].type;

            for (const pt of types) {
                if (random < pt.weight) {
                    selectedType = pt.type;
                    break;
                }
                random -= pt.weight;
            }

            switch (selectedType) {
                case 'addition': generateAddition(); break;
                case 'subtraction': generateSubtraction(); break;
                case 'multiplication': generateMultiplication(); break;
                case 'division': generateDivision(); break;
                case 'equation': generateEquation(); break;
                case 'cirkel': generateCirkel(); break;
                case 'trekant': generateTrekant(); break;
                case 'firkant': generateFirkant(); break;
                case 'rumfang': generateRumfang(); break;
            }

            document.getElementById('problem').textContent = currentProblem.problem;
            const badge = document.getElementById('type-badge');
            badge.textContent = typeNames[selectedType];
            badge.dataset.type = selectedType;

            const figure = document.getElementById('figure');
            if (currentProblem.figure) {
                figure.innerHTML = currentProblem.figure;
                figure.classList.add('visible');
            } else {
                figure.innerHTML = '';
                figure.classList.remove('visible');
            }

            const input = document.getElementById('answer-input');
            input.value = '';
            input.disabled = false;
            input.focus();
            document.getElementById('answer-feedback').className = 'feedback';
        }

        function generateAddition() {
            const a = Math.floor(Math.random() * 500) + 100;
            const b = Math.floor(Math.random() * 500) + 100;
            const result = a + b;

            currentProblem.type = 'addition';
            currentProblem.problem = `${a} + ${b}`;
            currentProblem.answer = result;

            const aStr = a.toString();
            const bStr = b.toString();

            currentProblem.steps = [
                `Lad os lægge <kbd>${aStr}</kbd> og <kbd>${bStr}</kbd> sammen kolonne for kolonne fra højre mod venstre:`,
                `Enerplads: <kbd>${aStr.charAt(aStr.length - 1)}</kbd> + <kbd>${bStr.charAt(bStr.length - 1)}</kbd> = <kbd>${(parseInt(aStr.charAt(aStr.length - 1)) + parseInt(bStr.charAt(bStr.length - 1)))}</kbd>`,
                aStr.length > 1 && bStr.length > 1 ? `Tierplads: <kbd>${aStr.charAt(aStr.length - 2)}</kbd> + <kbd>${bStr.charAt(bStr.length - 2)}</kbd> = <kbd>${(parseInt(aStr.charAt(aStr.length - 2)) + parseInt(bStr.charAt(bStr.length - 2)))}</kbd>` : '',
                aStr.length > 2 && bStr.length > 2 ? `Hundrederplads: <kbd>${aStr.charAt(0)}</kbd> + <kbd>${bStr.charAt(0)}</kbd> = <kbd>${(parseInt(aStr.charAt(0)) + parseInt(bStr.charAt(0)))}</kbd>` : '',
                `Slutresultat: <kbd>${a} + ${b} = ${result}</kbd>`
            ].filter(s => s !== '');
        }

        function generateSubtraction() {
            let a, b;
            do {
                a = Math.floor(Math.random() * 500) + 200;
                b = Math.floor(Math.random() * 400) + 100;
            } while (a <= b);

            const result = a - b;

            currentProblem.type = 'subtraction';
            currentProblem.problem = `${a} - ${b}`;
            currentProblem.answer = result;

            currentProblem.steps = [
                `Lad os trække <kbd>${b}</kbd> fra <kbd>${a}</kbd>:`,
                `Vi kan dele det op: <kbd>${a}</kbd> - <kbd>${b}</kbd> = <kbd>${a - b}</kbd>`,
                `Kontrol: <kbd>${result} + ${b} = ${a}</kbd>`,
                `Slutresultat: <kbd>${a} - ${b} = ${result}</kbd>`
            ];
        }

        function generateMultiplication() {
            const a = Math.floor(Math.random() * 20) + 2;
            const b = Math.floor(Math.random() * 20) + 2;
            const result = a * b;

            currentProblem.type = 'multiplication';
            currentProblem.problem = `${a} × ${b}`;
            currentProblem.answer = result;

            currentProblem.steps = [
                `Vi kan bruge den distributive lov for multiplikation:`,
                `Del det ene tal op: <kbd>${b} = ${Math.floor(b / 10) * 10} + ${b % 10}</kbd>`,
                `Først gange: <kbd>${a} × ${Math.floor(b / 10) * 10} = ${a * (Math.floor(b / 10) * 10)}</kbd>`,
                `Så gange: <kbd>${a} × ${b % 10} = ${a * (b % 10)}</kbd>`,
                `Læg delresultaterne sammen: <kbd>${a * (Math.floor(b / 10) * 10)} + ${a * (b % 10)} = ${result}</kbd>`,
                `Slutresultat: <kbd>${a} × ${b} = ${result}</kbd>`
            ];
        }

        function generateDivision() {
            let a, b;
            do {
                b = Math.floor(Math.random() * 12) + 2;
                const quotient = Math.floor(Math.random() * 20) + 2;
                a = b * quotient;
            } while (a > 300);

            const result = a / b;

            currentProblem.type = 'division';
            currentProblem.problem = `${a} ÷ ${b}`;
            currentProblem.answer = result;

            currentProblem.steps = [
                `Lad os dividere <kbd>${a}</kbd> med <kbd>${b}</kbd>:`,
                `Spørg: Hvor mange gange går <kbd>${b}</kbd> op i <kbd>${a}</kbd>?`,
                `Vi ved, at: <kbd>${b} × ${result} = ${a}</kbd>`,
                `Kontrol: <kbd>${result} × ${b} = ${a}</kbd>`,
                `Slutresultat: <kbd>${a} ÷ ${b} = ${result}</kbd>`
            ];
        }

        function generateEquation() {
            const equationTypes = ['ax+b=c', 'a(x+b)=c', 'ax-b=c', 'a(x-b)=c'];
            const type = equationTypes[Math.floor(Math.random() * equationTypes.length)];

            let a, b, c, x;

            switch (type) {
                case 'ax+b=c':
                    a = Math.floor(Math.random() * 8) + 2;
                    b = Math.floor(Math.random() * 20) + 1;
                    x = Math.floor(Math.random() * 10) + 1;
                    c = a * x + b;
                    currentProblem.problem = `${a}x + ${b} = ${c}`;
                    currentProblem.steps = [
                        `Givet: <kbd>${a}x + ${b} = ${c}</kbd>`,
                        `Trin 1: Træk <kbd>${b}</kbd> fra på begge sider: <kbd>${a}x = ${c - b}</kbd>`,
                        `Trin 2: Divider begge sider med <kbd>${a}</kbd>: <kbd>x = ${(c - b) / a}</kbd>`,
                        `Slutløsning: <kbd>x = ${x}</kbd>`
                    ];
                    break;
                case 'a(x+b)=c':
                    a = Math.floor(Math.random() * 6) + 2;
                    b = Math.floor(Math.random() * 10) + 1;
                    x = Math.floor(Math.random() * 8) + 1;
                    c = a * (x + b);
                    currentProblem.problem = `${a}(x + ${b}) = ${c}`;
                    currentProblem.steps = [
                        `Givet: <kbd>${a}(x + ${b}) = ${c}</kbd>`,
                        `Trin 1: Divider begge sider med <kbd>${a}</kbd>: <kbd>x + ${b} = ${c / a}</kbd>`,
                        `Trin 2: Træk <kbd>${b}</kbd> fra på begge sider: <kbd>x = ${c / a - b}</kbd>`,
                        `Slutløsning: <kbd>x = ${x}</kbd>`
                    ];
                    break;
                case 'ax-b=c':
                    a = Math.floor(Math.random() * 8) + 2;
                    b = Math.floor(Math.random() * 20) + 1;
                    x = Math.floor(Math.random() * 10) + 1;
                    c = a * x - b;
                    currentProblem.problem = `${a}x - ${b} = ${c}`;
                    currentProblem.steps = [
                        `Givet: <kbd>${a}x - ${b} = ${c}</kbd>`,
                        `Trin 1: Læg <kbd>${b}</kbd> til på begge sider: <kbd>${a}x = ${c + b}</kbd>`,
                        `Trin 2: Divider begge sider med <kbd>${a}</kbd>: <kbd>x = ${(c + b) / a}</kbd>`,
                        `Slutløsning: <kbd>x = ${x}</kbd>`
                    ];
                    break;
                case 'a(x-b)=c':
                    a = Math.floor(Math.random() * 6) + 2;
                    b = Math.floor(Math.random() * 10) + 1;
                    x = Math.floor(Math.random() * 8) + 1 + b;
                    c = a * (x - b);
                    currentProblem.problem = `${a}(x - ${b}) = ${c}`;
                    currentProblem.steps = [
                        `Givet: <kbd>${a}(x - ${b}) = ${c}</kbd>`,
                        `Trin 1: Divider begge sider med <kbd>${a}</kbd>: <kbd>x - ${b} = ${c / a}</kbd>`,
                        `Trin 2: Læg <kbd>${b}</kbd> til på begge sider: <kbd>x = ${c / a + b}</kbd>`,
                        `Slutløsning: <kbd>x = ${x}</kbd>`
                    ];
                    break;
            }
            currentProblem.type = 'equation';
            currentProblem.answer = x;
        }

        function svgCirkel(val, label) {
            const line = label === 'r'
                ? `<line x1="60" y1="45" x2="92" y2="45" stroke="#FFFAEB" stroke-width="3"/><text x="68" y="38" class="fig-label">r = ${val}</text>`
                : `<line x1="28" y1="45" x2="92" y2="45" stroke="#FFFAEB" stroke-width="3"/><text x="50" y="38" class="fig-label">d = ${val}</text>`;
            return `<svg viewBox="0 0 120 90" shape-rendering="crispEdges"><circle cx="60" cy="45" r="32" fill="rgba(255,216,0,0.12)" stroke="#FFD800" stroke-width="4"/>${line}</svg>`;
        }

        function generateCirkel() {
            const r = Math.floor(Math.random() * 11) + 2;
            const givenD = Math.random() < 0.5;
            const d = r * 2;
            currentProblem.type = 'cirkel';
            if (Math.random() < 0.5) {
                currentProblem.problem = 'O = ?';
                currentProblem.answer = round2(givenD ? PI * d : 2 * PI * r);
                currentProblem.figure = svgCirkel(givenD ? d : r, givenD ? 'd' : 'r');
                const given = givenD ? `diameteren <kbd>d = ${d}</kbd>` : `radius <kbd>r = ${r}</kbd>`;
                currentProblem.steps = [
                    `Vi skal finde omkredsen af cirklen med ${given}:`,
                    givenD ? `Formel: <kbd>O = π · d</kbd>` : `Formel: <kbd>O = 2 · π · r</kbd>`,
                    givenD
                        ? `Indsæt: <kbd>O = 3,14 · ${d} = ${formatNumber(round2(PI * d))}</kbd>`
                        : `Indsæt: <kbd>O = 2 · 3,14 · ${r} = ${formatNumber(round2(2 * PI * r))}</kbd>`,
                    `Slutresultat: <kbd>O = ${formatNumber(currentProblem.answer)}</kbd>`
                ];
            } else {
                currentProblem.problem = 'A = ?';
                currentProblem.answer = round2(PI * r * r);
                currentProblem.figure = svgCirkel(r, 'r');
                currentProblem.steps = [
                    `Vi skal finde arealet af cirklen med radius <kbd>r = ${r}</kbd>:`,
                    `Formel: <kbd>A = π · r²</kbd>`,
                    `Indsæt: <kbd>A = 3,14 · ${r}² = 3,14 · ${r * r} = ${formatNumber(round2(PI * r * r))}</kbd>`,
                    `Slutresultat: <kbd>A = ${formatNumber(currentProblem.answer)}</kbd>`
                ];
            }
        }

        function generateTrekant() {
            currentProblem.type = 'trekant';
            if (Math.random() < 0.5) {
                const g = Math.floor(Math.random() * 12) + 4;
                const h = Math.floor(Math.random() * 10) + 3;
                currentProblem.problem = 'A = ?';
                currentProblem.answer = (g * h) / 2;
                currentProblem.figure = `<svg viewBox="0 0 120 95" shape-rendering="crispEdges"><polygon points="20,70 100,70 100,25" fill="rgba(255,175,0,0.12)" stroke="#FFAF00" stroke-width="4"/><text x="52" y="88" class="fig-label">g = ${g}</text><text x="104" y="52" class="fig-label">h = ${h}</text></svg>`;
                currentProblem.steps = [
                    `Vi skal finde arealet af trekanten med grundlinje <kbd>g = ${g}</kbd> og højde <kbd>h = ${h}</kbd>:`,
                    `Formel: <kbd>A = ½ · g · h = (g · h) / 2</kbd>`,
                    `Indsæt: <kbd>A = (${g} · ${h}) / 2 = ${g * h} / 2 = ${formatNumber((g * h) / 2)}</kbd>`,
                    `Slutresultat: <kbd>A = ${formatNumber(currentProblem.answer)}</kbd>`
                ];
            } else {
                const a = Math.floor(Math.random() * 8) + 3;
                const b = Math.floor(Math.random() * 8) + 3;
                const c = Math.floor(Math.random() * 8) + 3;
                currentProblem.problem = 'O = ?';
                currentProblem.answer = a + b + c;
                currentProblem.figure = `<svg viewBox="0 0 120 95" shape-rendering="crispEdges"><polygon points="25,70 95,70 60,20" fill="rgba(255,175,0,0.12)" stroke="#FFAF00" stroke-width="4"/><text x="55" y="88" class="fig-label">c = ${c}</text><text x="8" y="50" class="fig-label">a = ${a}</text><text x="100" y="50" class="fig-label">b = ${b}</text></svg>`;
                currentProblem.steps = [
                    `Vi skal finde omkredsen af trekanten med siderne <kbd>a = ${a}</kbd>, <kbd>b = ${b}</kbd> og <kbd>c = ${c}</kbd>:`,
                    `Formel: <kbd>O = a + b + c</kbd>`,
                    `Indsæt: <kbd>O = ${a} + ${b} + ${c} = ${a + b + c}</kbd>`,
                    `Slutresultat: <kbd>O = ${a + b + c}</kbd>`
                ];
            }
        }

        function generateFirkant() {
            currentProblem.type = 'firkant';
            const wantAreal = Math.random() < 0.5;
            const square = Math.random() < 0.4;
            currentProblem.problem = wantAreal ? 'A = ?' : 'O = ?';
            if (square) {
                const s = Math.floor(Math.random() * 9) + 3;
                currentProblem.answer = wantAreal ? s * s : 4 * s;
                currentProblem.figure = `<svg viewBox="0 0 120 95" shape-rendering="crispEdges"><rect x="35" y="22" width="50" height="50" fill="rgba(255,130,5,0.12)" stroke="#FF8205" stroke-width="4"/><text x="54" y="16" class="fig-label">s = ${s}</text><text x="92" y="52" class="fig-label">s = ${s}</text></svg>`;
                currentProblem.steps = wantAreal ? [
                    `Vi skal finde arealet af kvadratet med sidelængden <kbd>s = ${s}</kbd>:`,
                    `Formel: <kbd>A = s²</kbd>`,
                    `Indsæt: <kbd>A = ${s}² = ${s * s}</kbd>`,
                    `Slutresultat: <kbd>A = ${s * s}</kbd>`
                ] : [
                    `Vi skal finde omkredsen af kvadratet med sidelængden <kbd>s = ${s}</kbd>:`,
                    `Formel: <kbd>O = 4 · s</kbd>`,
                    `Indsæt: <kbd>O = 4 · ${s} = ${4 * s}</kbd>`,
                    `Slutresultat: <kbd>O = ${4 * s}</kbd>`
                ];
            } else {
                const l = Math.floor(Math.random() * 11) + 4;
                const b = Math.floor(Math.random() * 8) + 3;
                currentProblem.answer = wantAreal ? l * b : 2 * (l + b);
                currentProblem.figure = `<svg viewBox="0 0 120 95" shape-rendering="crispEdges"><rect x="25" y="18" width="70" height="52" fill="rgba(255,130,5,0.12)" stroke="#FF8205" stroke-width="4"/><text x="54" y="12" class="fig-label">l = ${l}</text><text x="101" y="48" class="fig-label">b = ${b}</text></svg>`;
                currentProblem.steps = wantAreal ? [
                    `Vi skal finde arealet af rektanglet med længde <kbd>l = ${l}</kbd> og bredde <kbd>b = ${b}</kbd>:`,
                    `Formel: <kbd>A = l · b</kbd>`,
                    `Indsæt: <kbd>A = ${l} · ${b} = ${l * b}</kbd>`,
                    `Slutresultat: <kbd>A = ${l * b}</kbd>`
                ] : [
                    `Vi skal finde omkredsen af rektanglet med længde <kbd>l = ${l}</kbd> og bredde <kbd>b = ${b}</kbd>:`,
                    `Formel: <kbd>O = 2 · (l + b)</kbd>`,
                    `Indsæt: <kbd>O = 2 · (${l} + ${b}) = 2 · ${l + b} = ${2 * (l + b)}</kbd>`,
                    `Slutresultat: <kbd>O = ${2 * (l + b)}</kbd>`
                ];
            }
        }

        function generateRumfang() {
            currentProblem.type = 'rumfang';
            currentProblem.problem = 'V = ?';
            if (Math.random() < 0.4) {
                const s = Math.floor(Math.random() * 7) + 2;
                currentProblem.answer = s * s * s;
                currentProblem.figure = `<svg viewBox="0 0 120 105" shape-rendering="crispEdges"><polygon points="30,35 45,20 100,20 85,35" fill="rgba(255,106,94,0.15)" stroke="#FF6A5E" stroke-width="4"/><polygon points="85,35 100,20 100,75 85,90" fill="rgba(255,106,94,0.25)" stroke="#FF6A5E" stroke-width="4"/><rect x="30" y="35" width="55" height="55" fill="rgba(255,106,94,0.08)" stroke="#FF6A5E" stroke-width="4"/><text x="52" y="102" class="fig-label">s = ${s}</text><text x="88" y="66" class="fig-label">s = ${s}</text></svg>`;
                currentProblem.steps = [
                    `Vi skal finde rumfanget af terningen med kantlængden <kbd>s = ${s}</kbd>:`,
                    `Formel: <kbd>V = s³</kbd>`,
                    `Indsæt: <kbd>V = ${s}³ = ${s} · ${s} · ${s} = ${s * s * s}</kbd>`,
                    `Slutresultat: <kbd>V = ${s * s * s}</kbd>`
                ];
            } else {
                const l = Math.floor(Math.random() * 8) + 3;
                const b = Math.floor(Math.random() * 7) + 2;
                const h = Math.floor(Math.random() * 7) + 2;
                currentProblem.answer = l * b * h;
                currentProblem.figure = `<svg viewBox="0 0 120 105" shape-rendering="crispEdges"><polygon points="25,35 40,20 100,20 85,35" fill="rgba(255,106,94,0.15)" stroke="#FF6A5E" stroke-width="4"/><polygon points="85,35 100,20 100,75 85,90" fill="rgba(255,106,94,0.25)" stroke="#FF6A5E" stroke-width="4"/><rect x="25" y="35" width="60" height="55" fill="rgba(255,106,94,0.08)" stroke="#FF6A5E" stroke-width="4"/><text x="48" y="102" class="fig-label">l = ${l}</text><text x="88" y="66" class="fig-label">h = ${h}</text><text x="58" y="14" class="fig-label">b = ${b}</text></svg>`;
                currentProblem.steps = [
                    `Vi skal finde rumfanget af kassen med længde <kbd>l = ${l}</kbd>, bredde <kbd>b = ${b}</kbd> og højde <kbd>h = ${h}</kbd>:`,
                    `Formel: <kbd>V = l · b · h</kbd>`,
                    `Indsæt: <kbd>V = ${l} · ${b} · ${h} = ${l * b * h}</kbd>`,
                    `Slutresultat: <kbd>V = ${l * b * h}</kbd>`
                ];
            }
        }

        function showSolution() {
            const solutionDiv = document.getElementById('solution');
            const solutionSteps = document.getElementById('solution-steps');
            const showBtn = document.getElementById('show-solution');

            if (solutionDiv.classList.contains('visible')) {
                solutionDiv.classList.remove('visible');
                showBtn.textContent = '💡 Vis løsning';
            } else {
                let stepsHtml = '';
                currentProblem.steps.forEach((step) => {
                    stepsHtml += `<div class="step">${step}</div>`;
                });
                solutionSteps.innerHTML = stepsHtml;
                solutionDiv.classList.add('visible');
                showBtn.textContent = '📖 Skjul løsning';
            }
        }

        function formatNumber(n) {
            return String(n).replace('.', ',');
        }

        function round2(n) {
            return Math.round(n * 100) / 100;
        }

        function showFeedback(ok, msg) {
            const fb = document.getElementById('answer-feedback');
            fb.classList.remove('visible', 'correct', 'wrong');
            void fb.offsetWidth;
            fb.textContent = msg;
            fb.classList.add('visible', ok ? 'correct' : 'wrong');
        }

        function checkAnswer() {
            const input = document.getElementById('answer-input');
            if (input.disabled) return;
            const raw = input.value.trim().replace(',', '.');
            if (raw === '') {
                showFeedback(false, '❌ Skriv dit svar først!');
                return;
            }
            const guess = Number(raw);
            if (isNaN(guess)) {
                showFeedback(false, '❌ Det skal være et tal!');
                return;
            }
            const ans = currentProblem.answer;
            const tol = Number.isInteger(ans) ? 1e-6 : Math.max(0.05, Math.abs(ans) * 0.01);
            if (Math.abs(guess - ans) <= tol) {
                const msg = currentProblem.type === 'equation'
                    ? `✅ KORREKT! x = ${formatNumber(ans)}`
                    : `✅ KORREKT! ${currentProblem.problem.replace('= ?', '= ' + formatNumber(ans))}`;
                showFeedback(true, msg);
                input.disabled = true;
                stats[activeModule].total++;
                stats[activeModule][currentProblem.type]++;
                renderStats();
            } else {
                showFeedback(false, '❌ Forkert — prøv igen!');
            }
        }

        function renderStats() {
            const cfg = statConfig[activeModule];
            for (let i = 0; i < 6; i++) {
                const item = document.getElementById('stat-' + i);
                const val = document.getElementById('stat-v' + i);
                const lab = document.getElementById('stat-l' + i);
                const key = cfg.keys[i];
                if (!key) {
                    item.style.display = 'none';
                    continue;
                }
                item.style.display = '';
                val.textContent = stats[activeModule][key];
                val.style.color = cfg.colors[i];
                lab.textContent = cfg.labels[i];
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target && e.target.id === 'answer-input') {
                if (e.key === 'Enter') {
                    checkAnswer();
                    e.preventDefault();
                }
                return;
            }
            if (e.target && e.target.tagName === 'BUTTON') return;
            if (e.key === 'Enter' || e.key === ' ') {
                showSolution();
                e.preventDefault();
            } else if (e.key === 'r' || e.key === 'R') {
                generateProblem();
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
