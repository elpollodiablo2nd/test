name: Release Math Aid APK

# Kører ved hvert tag på formen v* (fx: git tag v1.0.0 && git push origin v1.0.0)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Manuel SDK-installation: android-actions/setup-android@v3 fejler, fordi den
      # kalder `sdkmanager tools`, og pakken findes ikke længere i nye cmdline-tools.
      - name: Set up Android SDK (cmdline-tools, manuelt)
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Keystore fra repo-secrets hvis de findes, ellers midlertidig nøgle.
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          KS="$PWD/math-aid/android/app/keystore.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            export KEYSTORE_PASSWORD="$SECRET_STORE_PASSWORD" KEY_ALIAS="$SECRET_KEY_ALIAS" KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$KS" -alias mathaid -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit -keypass changeit -dname "CN=Math Aid, OU=Dev, O=Mistral, C=DK"
            export KEYSTORE_PASSWORD=changeit KEY_ALIAS=mathaid KEY_PASSWORD=changeit
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: math-aid/android
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release with APK attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="math-aid/android/app/build/outputs/apk/release/app-release.apk"
          NOTES="Math Aid $TAG — pixel-udgaven i Mistral-stil (4 moduler: tal & ligninger, geometri, brøker, enheder; dagens % rigtige + 14-dages graf gemt lokalt). Installer på Android: download app-release.apk og åbn den på telefonen, eller brug \`adb install app-release.apk\`."
          gh release create "$TAG" "$APK" --title "Math Aid $TAG" --notes "$NOTES" \
            || gh release upload "$TAG" "$APK" --clobber
