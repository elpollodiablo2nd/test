[project]
name = "workflows-app"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "utils",
    "env",
    "httpx>=0.28",
    "mistralai>=3.6.0",
    "mistralai-workflows[mistralai]>=3.17.1",
    "numpy>=2",
    "pydantic>=2.14.1",
    "structlog>=25.5.0",
    "timestral",
    "torch>=2.4",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker"

[tool.uv.sources]
utils = { workspace = true }
env = { workspace = true }
mistralai-workflows = { index = "pypi" }
timestral = { workspace = true }
# CPU-only torch wheels keep the worker image small; the PyTorch CPU index is linux-only,
# so other platforms (local dev on macOS) fall back to the default PyPI torch.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
